version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: indofinity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: indofinity
      POSTGRES_PASSWORD: indofinity123
      POSTGRES_DB: indofinity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: indofinity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
