# fly.toml app configuration file generated for indofinity on 2026-10-08
# Dokumentasi: https://fly.io/docs/reference/configuration/

app = "indofinity"
primary_region = "sin"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
